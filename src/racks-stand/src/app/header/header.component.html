<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container-fluid">
    <!-- Logo Section -->
    <a class="navbar-brand d-flex align-items-center" href="#">
      <img src="assets/logo.png" alt="Logo" width="40" height="40" class="d-inline-block align-top">
      <span class="ms-2">MySite</span>
    </a>

    <!-- Navbar Toggler for mobile view -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Navbar Links Section -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/home" routerLinkActive="active">Home</a>
        </li>

        <!-- Main Silos Section -->
        <li class="nav-item" *ngFor="let silo of silos" (click)="toggleSubNav(silo)">
          <a class="nav-link" href="javascript:void(0)">{{ silo.name }}</a>
        </li>

        <!-- Profile and Sign In/Sign Up Links -->
        <ng-container *ngIf="isLoggedIn; else loggedOut">
          <!-- Profile Dropdown -->
          <li class="nav-item dropdown">
            <a
              class="nav-link dropdown-toggle"
              href="javascript:void(0)"
              id="profileDropdown"
              role="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              <img src="assets/profile-icon.png" alt="Profile" width="30" height="30" class="rounded-circle">
            </a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profileDropdown">
              <li><a class="dropdown-item" href="javascript:void(0)">Settings</a></li>
              <li><a class="dropdown-item" href="javascript:void(0)">Logout</a></li>
            </ul>
          </li>
        </ng-container>
        <ng-template #loggedOut>
          <li class="nav-item">
            <a class="nav-link" routerLink="/signin" routerLinkActive="active">Sign In</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/signup" routerLinkActive="active">Sign Up</a>
          </li>
        </ng-template>
      </ul>
    </div>
  </div>
</nav>

<!-- Sub-navbar that appears under main navbar when a silo is clicked -->
<div *ngIf="isSubNavVisible" class="sub-nav-container bg-secondary py-2">
  <div class="container">
    <ul class="nav sub-nav-links">
      <li class="nav-item" *ngFor="let action of selectedSiloActions">
        <a class="nav-link" href="javascript:void(0)">{{ action }}</a>
      </li>
    </ul>
  </div>
</div>
