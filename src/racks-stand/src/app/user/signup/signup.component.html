<div class="flex min-h-screen bg-gray-100">
  <!-- Left Section: Signup Form -->
  <div class="w-full md:w-1/2 bg-white p-8 shadow-lg">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Create Your Account</h2>

    <!-- Signup Form -->
    <form [formGroup]="signupForm" (ngSubmit)="signup()">

      <!-- Name Field -->
      <div class="mb-4">
        <label for="name" class="block text-gray-600">Full Name</label>
        <input
          type="text"
          id="name"
          formControlName="name"
          class="w-full px-4 py-2 mt-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Enter your full name"
        />
        <div *ngIf="f['name'].touched && f['name'].invalid" class="text-red-500 text-sm mt-1">
          <div *ngIf="f['name'].errors?.['required']">Full name is required.</div>
        </div>
      </div>

      <!-- Email Field -->
      <div class="mb-4">
        <label for="email" class="block text-gray-600">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="w-full px-4 py-2 mt-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Enter your email"
        />
        <div *ngIf="f['email'].touched && f['email'].invalid" class="text-red-500 text-sm mt-1">
          <div *ngIf="f['email'].errors?.['required']">Email is required.</div>
          <div *ngIf="f['email'].errors?.['email']">Please enter a valid email address.</div>
        </div>
      </div>

      <!-- Password Field -->
      <div class="mb-4">
        <label for="password" class="block text-gray-600">Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="w-full px-4 py-2 mt-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Enter your password"
        />
        <div *ngIf="f['password'].touched && f['password'].invalid" class="text-red-500 text-sm mt-1">
          <div *ngIf="f['password'].errors?.['required']">Password is required.</div>
          <div *ngIf="f['password'].errors?.['minlength']">Password must be at least 6 characters long.</div>
        </div>
      </div>

      <!-- Confirm Password Field -->
      <div class="mb-6">
        <label for="confirmPassword" class="block text-gray-600">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          formControlName="confirmPassword"
          class="w-full px-4 py-2 mt-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Confirm your password"
        />
        <div *ngIf="f['confirmPassword'].touched && f['confirmPassword'].invalid" class="text-red-500 text-sm mt-1">
          <div *ngIf="f['confirmPassword'].errors?.['required']">Confirm Password is required.</div>
          <div *ngIf="f['confirmPassword'].errors?.['match']">Passwords must match.</div>
        </div>
      </div>

      <!-- Error message display -->
      <div *ngIf="errorMessage" class="text-red-500 text-sm mb-4">{{ errorMessage }}</div>

      <button
        type="submit"
        class="w-full py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
        [disabled]="signupForm.invalid"
      >
        Sign Up
      </button>
    </form>

    <div class="mt-4 text-center">
      <p class="text-gray-600">
        Already have an account? <a href="/login" class="text-blue-600 hover:underline">Login here</a>
      </p>
    </div>
  </div>

  <!-- Right Section: Image -->
  <div class="hidden md:block w-1/2 bg-blue-500">
    <img src="https://www.skusavvy.com/images/your-image.jpg" alt="Image" class="w-full h-full object-cover rounded-r-lg">
  </div>
</div>
