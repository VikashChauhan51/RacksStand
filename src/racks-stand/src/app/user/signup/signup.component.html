<div class="flex min-h-screen bg-gray-100">
  <!-- Left Section: Signup Form -->
  <div class="w-full md:w-1/2 bg-white p-8 shadow-lg">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">
      @if (currentStep === 1) {
      <ng-container>Step 1: User Information</ng-container>
      } @if (currentStep === 2) {
      <ng-container>Step 2: Company Information</ng-container>
      }
    </h2>

    <!-- Signup Form -->
    <form [formGroup]="signupForm" (ngSubmit)="submitForm()">
      @if (currentStep === 1) {
      <div>
        <div class="mb-4">
          <label for="name" class="block text-gray-600">Name</label>
          <input
            type="text"
            id="name"
            formControlName="name"
            class="w-full px-4 py-2 mt-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Enter your name"
          />
          <app-validation-error [control]="f['name']" fieldName="Name"></app-validation-error>
        </div>

        <div class="mb-4">
          <label for="email" class="block text-gray-600">Email</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            class="w-full px-4 py-2 mt-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Enter your email"
          />
          <app-validation-error [control]="f['email']" fieldName="Email"></app-validation-error>
        </div>

        <div class="mb-4">
          <label for="password" class="block text-gray-600">Password</label>
          <input
            type="password"
            id="password"
            formControlName="password"
            class="w-full px-4 py-2 mt-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Enter your password"
          />
          <app-validation-error [control]="f['password']" fieldName="Password"></app-validation-error>
        </div>
        <div class="mb-4">
          <label for="email" class="block text-gray-600">Phone Number</label>
          <input
            type="tel"
            id="phoneNumber"
            formControlName="phoneNumber"
            class="w-full px-4 py-2 mt-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Enter your phone number"
          />
          <app-validation-error [control]="f['phoneNumber']" fieldName="Phone Number"></app-validation-error>
        </div>

      </div>
      } @if (currentStep === 2) {
      <div>
        <!-- Company Name -->
        <div class="mb-4">
          <label for="companyName" class="block text-gray-600"
            >Company Name</label
          >
          <input
            type="text"
            id="companyName"
            formControlName="companyName"
            class="w-full px-4 py-2 mt-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Enter your company name"
          />
          <app-validation-error [control]="f['companyName']" fieldName="Company Name"></app-validation-error>
        </div>

        <!-- Address Fields in Two Columns -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <!-- Address Line 1 -->
          <div>
            <label for="address1" class="block text-gray-600"
              >Address Line 1</label
            >
            <input
              type="text"
              id="address1"
              formControlName="address1"
              class="w-full px-4 py-2 mt-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Enter address line 1"
            />
            <app-validation-error [control]="f['address1']" fieldName="Address1"></app-validation-error>
          </div>

          <!-- Address Line 2 -->
          <div>
            <label for="address2" class="block text-gray-600"
              >Address Line 2</label
            >
            <input
              type="text"
              id="address2"
              formControlName="address2"
              class="w-full px-4 py-2 mt-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Enter address line 2 (optional)"
            />
            <app-validation-error [control]="f['address2']" fieldName="Address2"></app-validation-error>
          </div>
        </div>

        <!-- State and City in Two Columns -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <!-- State -->
          <div>
            <label for="state" class="block text-gray-600">State</label>
            <input
              type="text"
              id="state"
              formControlName="state"
              class="w-full px-4 py-2 mt-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Enter state"
            />
            <app-validation-error [control]="f['state']" fieldName="State"></app-validation-error>
          </div>

          <!-- City -->
          <div>
            <label for="city" class="block text-gray-600">City</label>
            <input
              type="text"
              id="city"
              formControlName="city"
              class="w-full px-4 py-2 mt-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Enter city"
            />
            <app-validation-error [control]="f['city']" fieldName="City"></app-validation-error>
          </div>
        </div>

        <!-- Country and Zipcode in Two Columns -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <!-- Country -->
          <div>
            <label for="country" class="block text-gray-600">Country</label>
            <input
              type="text"
              id="country"
              formControlName="country"
              class="w-full px-4 py-2 mt-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Enter country"
            />
            <app-validation-error [control]="f['country']" fieldName="Country"></app-validation-error>
          </div>

          <!-- Zipcode -->
          <div>
            <label for="zipcode" class="block text-gray-600">Zipcode</label>
            <input
              type="text"
              id="zipcode"
              formControlName="zipcode"
              class="w-full px-4 py-2 mt-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Enter zipcode"
            />
            <app-validation-error [control]="f['zipcode']" fieldName="ZipCode"></app-validation-error>
          </div>
        </div>
      </div>
      }

      <!-- Error message display -->
      <div *ngIf="errorMessage" class="text-red-500 text-sm mb-4">
        {{ errorMessage }}
      </div>

      <!-- Navigation buttons -->
      <div class="flex justify-between">
        @if (currentStep === 2) {
        <button
          type="button"
          class="bg-gray-600 text-white px-4 py-2 rounded"
          (click)="prevStep()"
        >
          Back
        </button>
        } @if (currentStep === 1) {
        <button
          type="button"
          class="bg-blue-600 text-white px-4 py-2 rounded"
          (click)="nextStep()"
        >
          Next
        </button>
        }
      </div>

      <!-- Submit button -->
      @if (currentStep === 2) {
      <div>
        <br />
        <button
          type="submit"
          class="w-full py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
          [disabled]="signupForm.invalid"
        >
          Submit
        </button>
      </div>
      }
    </form>
  </div>

  <!-- Right Section: Image -->
  <div class="hidden md:block w-1/2 bg-blue-500">
    <img
      src="https://www.skusavvy.com/images/your-image.jpg"
      alt="Signup Image"
      class="w-full h-full object-cover rounded-r-lg"
    />
  </div>
</div>
