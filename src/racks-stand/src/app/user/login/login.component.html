<div class="flex min-h-screen items-center justify-center bg-gray-100">
  <!-- Left Section: Login Form -->
  <div class="w-full md:w-1/2 bg-white p-8 rounded-lg shadow-lg">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Login to Your Account</h2>

    <!-- Login Form -->
    <form (ngSubmit)="login()">
      <div class="mb-4">
        <label for="email" class="block text-gray-600">Email</label>
        <input type="email" id="email" [(ngModel)]="email" name="email"
          class="w-full px-4 py-2 mt-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Enter your email" required>
      </div>

      <div class="mb-6">
        <label for="password" class="block text-gray-600">Password</label>
        <input type="password" id="password" [(ngModel)]="password" name="password"
          class="w-full px-4 py-2 mt-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Enter your password" required>
      </div>

      <!-- Error message display -->
      <div *ngIf="errorMessage" class="text-red-500 text-sm mb-4">{{ errorMessage }}</div>

      <button type="submit"
        class="w-full py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
        Login
      </button>
    </form>

    <div class="mt-4 text-center">
      <p class="text-gray-600">Don't have an account? <a href="/signup" class="text-blue-600 hover:underline">Sign up here</a></p>
    </div>
  </div>

  <!-- Right Section: Image -->
  <div class="hidden md:block w-1/2 bg-blue-500 rounded-r-lg">
    <img src="https://www.skusavvy.com/images/your-image.jpg" alt="Image" class="w-full h-full object-cover rounded-r-lg">
  </div>
</div>
