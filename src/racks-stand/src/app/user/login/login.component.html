<div class="flex min-h-screen  bg-gray-100">
  <!-- Left Section: Login Form -->
  <div class="w-full md:w-1/2 bg-white p-8  shadow-lg">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Login to Your Account</h2>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <div class="mb-4">
        <label for="email" class="block text-gray-600">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="w-full px-4 py-2 mt-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Enter your email"
        />
        <!-- Display validation errors for email -->
        <app-validation-error [control]="f['email']" fieldName="Email"></app-validation-error>
      </div>

      <div class="mb-6">
        <label for="password" class="block text-gray-600">Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="w-full px-4 py-2 mt-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Enter your password"
        />
        <!-- Display validation errors for password -->
        <app-validation-error [control]="f['password']" fieldName="Password"></app-validation-error>
      </div>

      <!-- Error message display -->
      <div *ngIf="errorMessage" class="text-red-500 text-sm mb-4">{{ errorMessage }}</div>

      <button
        type="submit"
        class="w-full py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
        [disabled]="loginForm.invalid"
      >
        Login
      </button>
    </form>

    <div class="mt-4 text-center">
      <p class="text-gray-600">
        Don't have an account? <a href="/signup" class="text-blue-600 hover:underline">Sign up here</a>
      </p>
    </div>
  </div>

  <!-- Right Section: Image -->
  <div class="hidden md:block w-1/2 bg-blue-500">
    <img src="https://www.skusavvy.com/images/your-image.jpg" alt="Image" class="w-full h-full object-cover rounded-r-lg">
  </div>
</div>
