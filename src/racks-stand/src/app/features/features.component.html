<section class="features">
  <h2>Key Features</h2>
  <div class="grid">
    <div *ngFor="let feature of features; let i = index" [ngClass]="'feature-card-' + (i + 1)">
      <img [src]="feature.icon" alt="Feature Icon">
      <h3>{{ feature.title }}</h3>
      <p>{{ feature.description }}</p>
    </div>
  </div>
</section>
